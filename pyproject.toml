[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ProjetoWhatsApp"
version = "1.0.0"
description = "Automação para download de fotos e vídeos do WhatsApp Web"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Sergio Rocha" }
]

dependencies = [
    "playwright>=1.55.0",
    "rich>=14.0.0",
    "typer>=0.16.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11.0",
    "loguru>=0.7.3",
    "sqlalchemy>=2.0.40",
    "tenacity>=9.1.2",
    "orjson>=3.10.18",
    "pillow>=11.3.0",
    "imagehash>=4.3.2"
]

[tool.setuptools]
packages = ["services", "models", "utils"]